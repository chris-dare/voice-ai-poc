name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    env:
      VOICE_AI_IMAGE: ghcr.io/example/voice-ai@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DATABASE_URL: postgresql+asyncpg://voice_ai:test@postgres.example/voice_ai
      AGENT_MODEL: openrouter:openai/gpt-5.6-luna
      AGENT_RELEASE_VERSION: test-release
      AGENT_SHARED_SECRET: test-only-secret-with-at-least-32-characters
      AUTH0_DOMAIN: test.example.auth0.com
      AUTH0_AUDIENCE: https://agent-api.test.example
      AUTH0_SPA_CLIENT_ID: test-spa-client
      PUBLIC_BASE_URL: https://voice.test.example
      ICE_SERVERS: '[{"urls":"turns:turn.test.example","username":"test","credential":"test"}]'
      MAX_CONCURRENT_SESSIONS: "4"
      WHISPER_REVISION: ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate local gateway and optional Ollama graphs
        run: |
          docker compose config --format json | python3 scripts/validate_deployment.py remote-local
          docker compose --profile local-model config --format json | python3 scripts/validate_deployment.py local-model

      - name: Validate fail-closed production graph
        run: |
          docker compose -f compose.production.yaml config --format json \
            | python3 scripts/validate_deployment.py production
          if env \
            -u VOICE_AI_IMAGE \
            -u DATABASE_URL \
            -u AGENT_MODEL \
            -u AGENT_RELEASE_VERSION \
            -u AGENT_SHARED_SECRET \
            -u AUTH0_DOMAIN \
            -u AUTH0_AUDIENCE \
            -u AUTH0_SPA_CLIENT_ID \
            -u PUBLIC_BASE_URL \
            -u ICE_SERVERS \
            -u MAX_CONCURRENT_SESSIONS \
            -u WHISPER_REVISION \
            docker compose --env-file /dev/null -f compose.production.yaml config --quiet; then
            echo "The production graph rendered without its required configuration."
            exit 1
          fi

  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python
        run: uv python install 3.13.14

      - name: Ruff lint
        run: uvx --from ruff==0.16.0 ruff check --output-format=github .

      - name: Ruff format
        run: uvx --from ruff==0.16.0 ruff format --check .

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      UV_PYTHON: "3.13"
    # The suite runs on SQLite by default. The PostgreSQL tests
    # (tests/agent/telco/test_tools_postgres.py, tests/agent/api/) skip unless
    # TEST_DATABASE_URL is set and its name contains "test" — hence voice_ai_test.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: voice_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d voice_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python
        run: uv python install 3.13.14

      - name: Install dependencies
        run: uv sync --frozen --all-extras --group dev

      - name: Verify migration upgrade and rollback path
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/voice_ai_test
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Run tests with coverage
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/voice_ai_test
        run: uv run pytest --cov --cov-branch --cov-report=xml

      - name: Retain coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.xml
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: false # don't block on Codecov outages

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test, type check and build
        run: npm run check

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          version: "0.12.3"

      - name: Set up Python
        run: uv python install 3.13.14

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # CVE-2025-71176 is pytest's tmpdir handling — a dev-only dependency that
      # never runs in the shipped image. Drop the ignore once pytest 9 lands here.
      - name: Audit Python dependencies
        run: uv audit --preview --ignore GHSA-6w46-j5rx-g56g

      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  supply-chain:
    name: Source & image supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate source SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: voice-ai.spdx.json
          artifact-name: voice-ai-sbom.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Scan source SBOM for critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: voice-ai.spdx.json
          fail-build: true
          severity-cutoff: critical
          vex: security/openvex.json
          output-format: table

      - name: Build the production image
        env:
          IMAGE: voice-ai-ci:${{ github.sha }}
        run: |
          docker buildx create --name voice-ai-ci --driver docker-container --use
          docker buildx build \
            --load \
            --provenance=false \
            --cache-from type=gha,scope=voice-ai-production \
            --cache-to type=gha,mode=max,scope=voice-ai-production \
            --build-arg WHISPER_MODEL=base \
            --build-arg WHISPER_REVISION=ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66 \
            --tag "$IMAGE" \
            .

      - name: Verify unprivileged image assets
        env:
          IMAGE: voice-ai-ci:${{ github.sha }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" -c \
            "import os, sys, av, cv2; from faster_whisper.utils import download_model; from pathlib import Path; from pipecat.transports.smallwebrtc.transport import SmallWebRTCTransport; from voice_ai.voice.speech.assets import kokoro_assets_valid; p=download_model('base', cache_dir='/app/models/whisper', revision='ebe41f70d5b6dfa9166e2c581c45c9c0cfc57b66', local_files_only=True); assert sys.version_info[:2] == (3, 13); assert Path(p).is_dir(); assert kokoro_assets_valid(Path('/app/models/kokoro')); assert Path('/app/frontend/dist/index.html').is_file(); assert os.getuid() == 10001; assert not os.access('/app', os.W_OK); assert SmallWebRTCTransport; assert av.__version__; assert cv2.__version__"

      - name: Generate production image SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: voice-ai-ci:${{ github.sha }}
          format: spdx-json
          output-file: voice-ai-image.spdx.json
          artifact-name: voice-ai-image-sbom.spdx.json
          upload-artifact-retention: 30
          upload-release-assets: false

      - name: Scan production image for critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: voice-ai-image.spdx.json
          fail-build: true
          severity-cutoff: critical
          output-format: table

      - name: Scan production image for fixable high vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: voice-ai-image.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          vex: security/openvex.json
          output-format: table

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install and run Semgrep
        run: |
          pip install semgrep==1.172.0
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --error \
            voice_ai/

  secret-scan:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # scan full git history

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
