[project]
name = "voice-ai"
version = "0.1.0"
description = "A local, real-time general-purpose voice AI assistant POC"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "logfire[asyncpg,fastapi,httpx,sqlalchemy,system-metrics]>=4.39.0",
  "opentelemetry-exporter-otlp-proto-http>=1.35,<2",
  "pipecat-ai[kokoro,piper,silero,webrtc,whisper]==1.5.0",
  "pydantic-ai-harness[code-mode]>=0.9,<0.10",
  "pydantic-ai-slim[anthropic,duckduckgo,mcp,openai,web-fetch]==2.14.1",
  "pydantic-monty==0.0.18",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "rich>=14,<15",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
voice-ai = "voice_ai.cli:main"

[build-system]
requires = ["uv_build>=0.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "voice_ai"
module-root = ""

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "pydantic-evals==2.14.1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
