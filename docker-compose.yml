name: voice-ai

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: voice_ai
      POSTGRES_USER: voice_ai
      POSTGRES_PASSWORD: voice_ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_ai -d voice_ai"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    restart: unless-stopped

  postgres-test:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: voice_ai_test
      POSTGRES_USER: voice_ai
      POSTGRES_PASSWORD: voice_ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_ai -d voice_ai_test"]
      interval: 1s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5433:5432"

  ollama:
    image: ollama/ollama:0.32.3
    profiles: ["local-model"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 30
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  ollama-init:
    image: ollama/ollama:0.32.3
    profiles: ["local-model"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - test -n "$$OLLAMA_MODEL" || { echo "OLLAMA_MODEL must be set" >&2; exit 64; }; exec ollama pull "$$OLLAMA_MODEL"
    restart: "no"

  migrate:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://voice_ai:voice_ai@postgres:5432/voice_ai
    command: ["migrate"]
    restart: "no"

  agent:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://voice_ai:voice_ai@postgres:5432/voice_ai
      OLLAMA_BASE_URL: http://ollama:11434
      AGENT_MODEL: ${AGENT_MODEL:?AGENT_MODEL must be set}
      AGENT_MODELS: ${AGENT_MODELS:-[]}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_GATEWAY_BASE_URL: ${AGENT_GATEWAY_BASE_URL:-}
      AGENT_GATEWAY_API_KEY: ${AGENT_GATEWAY_API_KEY:-}
      AGENT_EMBEDDED_WORKER: "false"
      AGENT_DEPLOYMENT_PROFILE: ${AGENT_DEPLOYMENT_PROFILE:-laptop}
      AGENT_QUEUE_CAPACITY: ${AGENT_QUEUE_CAPACITY:-1000}
      AGENT_TENANT_ACTIVE_RESPONSE_LIMIT: ${AGENT_TENANT_ACTIVE_RESPONSE_LIMIT:-25}
      AGENT_MODEL_ROUTE_CONCURRENCY: ${AGENT_MODEL_ROUTE_CONCURRENCY:-8}
      AGENT_RELEASE_VERSION: ${AGENT_RELEASE_VERSION:-0.1.0}
      AGENT_TOOL_ROUTE_CONCURRENCY: ${AGENT_TOOL_ROUTE_CONCURRENCY:-8}
      AGENT_CAPACITY_WAIT_SECONDS: ${AGENT_CAPACITY_WAIT_SECONDS:-30}
      AGENT_CAPACITY_LEASE_SECONDS: ${AGENT_CAPACITY_LEASE_SECONDS:-120}
      AGENT_CAPACITY_HEARTBEAT_SECONDS: ${AGENT_CAPACITY_HEARTBEAT_SECONDS:-15}
      AGENT_STREAM_BUFFER_CAPACITY: ${AGENT_STREAM_BUFFER_CAPACITY:-128}
      AGENT_EVENT_BROKER_CAPACITY: ${AGENT_EVENT_BROKER_CAPACITY:-10000}
      AGENT_MAX_OUTPUT_BYTES: ${AGENT_MAX_OUTPUT_BYTES:-1048576}
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: 8100
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-local-agent-secret}
      API_ENABLED: ${API_ENABLED:-false}
      API_AGENT_ID: ${API_AGENT_ID:-agent_general_assistant}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_TENANT_CLAIM: ${AUTH0_TENANT_CLAIM:-org_id}
      AUTH0_DEFAULT_TENANT_ID: ${AUTH0_DEFAULT_TENANT_ID:-}
      API_RATE_LIMIT_RPM: ${API_RATE_LIMIT_RPM:-60}
      API_MAX_REQUEST_BODY_BYTES: ${API_MAX_REQUEST_BODY_BYTES:-1048576}
      LOGFIRE_ENABLED: ${LOGFIRE_ENABLED:-false}
      LOGFIRE_ENVIRONMENT: ${LOGFIRE_ENVIRONMENT:-development}
      LOGFIRE_CAPTURE_CONTENT: ${LOGFIRE_CAPTURE_CONTENT:-false}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_METRICS_ENDPOINT: ${OTLP_METRICS_ENDPOINT:-}
    command: ["agent"]
    expose:
      - "8100"
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/readyz')"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  agent-worker:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+asyncpg://voice_ai:voice_ai@postgres:5432/voice_ai
      OLLAMA_BASE_URL: http://ollama:11434
      AGENT_MODEL: ${AGENT_MODEL:?AGENT_MODEL must be set}
      AGENT_MODELS: ${AGENT_MODELS:-[]}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_GATEWAY_BASE_URL: ${AGENT_GATEWAY_BASE_URL:-}
      AGENT_GATEWAY_API_KEY: ${AGENT_GATEWAY_API_KEY:-}
      AGENT_DEPLOYMENT_PROFILE: ${AGENT_DEPLOYMENT_PROFILE:-laptop}
      AGENT_WORKER_CONCURRENCY: ${AGENT_WORKER_CONCURRENCY:-4}
      AGENT_MODEL_ROUTE_CONCURRENCY: ${AGENT_MODEL_ROUTE_CONCURRENCY:-8}
      AGENT_RELEASE_VERSION: ${AGENT_RELEASE_VERSION:-0.1.0}
      AGENT_TOOL_ROUTE_CONCURRENCY: ${AGENT_TOOL_ROUTE_CONCURRENCY:-8}
      AGENT_CAPACITY_WAIT_SECONDS: ${AGENT_CAPACITY_WAIT_SECONDS:-30}
      AGENT_CAPACITY_LEASE_SECONDS: ${AGENT_CAPACITY_LEASE_SECONDS:-120}
      AGENT_CAPACITY_HEARTBEAT_SECONDS: ${AGENT_CAPACITY_HEARTBEAT_SECONDS:-15}
      AGENT_STREAM_BUFFER_CAPACITY: ${AGENT_STREAM_BUFFER_CAPACITY:-128}
      AGENT_EVENT_BROKER_CAPACITY: ${AGENT_EVENT_BROKER_CAPACITY:-10000}
      AGENT_MAX_OUTPUT_BYTES: ${AGENT_MAX_OUTPUT_BYTES:-1048576}
      API_ENABLED: ${API_ENABLED:-false}
      API_AGENT_ID: ${API_AGENT_ID:-agent_general_assistant}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      LOGFIRE_ENABLED: ${LOGFIRE_ENABLED:-false}
      LOGFIRE_ENVIRONMENT: ${LOGFIRE_ENVIRONMENT:-development}
      LOGFIRE_CAPTURE_CONTENT: ${LOGFIRE_CAPTURE_CONTENT:-false}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_METRICS_ENDPOINT: ${OTLP_METRICS_ENDPOINT:-}
    command: ["worker"]
    restart: unless-stopped

  voice-gateway:
    build:
      context: .
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-base}
    depends_on:
      agent:
        condition: service_healthy
    environment:
      AGENT_BASE_URL: http://agent:8100
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-local-agent-secret}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      KOKORO_VOICE: ${KOKORO_VOICE:-af_heart}
      MODEL_CACHE_DIR: /app/models
      FRONTEND_DIST: /app/frontend/dist
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-laptop}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ICE_SERVERS: ${ICE_SERVERS:-[]}
      MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-1}
      VOICE_MAX_REQUEST_BODY_BYTES: ${VOICE_MAX_REQUEST_BODY_BYTES:-1048576}
      API_ENABLED: ${API_ENABLED:-false}
      API_AGENT_ID: ${API_AGENT_ID:-agent_general_assistant}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      AUTH0_SPA_CLIENT_ID: ${AUTH0_SPA_CLIENT_ID:-}
      LOGFIRE_ENABLED: ${LOGFIRE_ENABLED:-false}
      LOGFIRE_ENVIRONMENT: ${LOGFIRE_ENVIRONMENT:-development}
      LOGFIRE_CAPTURE_CONTENT: ${LOGFIRE_CAPTURE_CONTENT:-false}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      OTLP_METRICS_ENDPOINT: ${OTLP_METRICS_ENDPOINT:-}
    command: ["voice"]
    ports:
      - "7860:7860"
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.3
    profiles: ["turn"]
    command:
      - --no-cli
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-voice-ai.local}
      - --user=${TURN_USERNAME:-voice-ai}:${TURN_PASSWORD:-change-me}
      - --external-ip=${TURN_EXTERNAL_IP:-127.0.0.1}
      - --min-port=49160
      - --max-port=49200
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"

volumes:
  postgres-data:
  ollama-data:
